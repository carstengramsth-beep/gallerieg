<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GalleriEG – Elisabeth Gram</title>
<meta name="description" content="GalleriEG – kunst af Elisabeth Gram. Ny hjemmeside under konstruktion.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --deep:#0f1f3a; --ink:#f4efe6; --gold:#d9b96a; --muted:#b9c3d6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; flex-direction:column; background:var(--deep);
         color:var(--ink); font-family:Inter, sans-serif; }
  .banner { width:100%; display:block; aspect-ratio:1883/372; object-fit:cover; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
         text-align:center; padding:56px 20px 40px; }
  h1 { font-family:"Cormorant Garamond", serif; font-weight:600; font-size:clamp(40px, 8vw, 68px);
       line-height:1.05; margin-bottom:10px; }
  .sub { font-family:"Cormorant Garamond", serif; font-style:italic; font-size:22px;
         color:var(--muted); margin-bottom:34px; }
  hr { width:64px; border:0; border-top:1px solid var(--gold); margin:0 auto 34px; }
  .status { font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold);
            margin-bottom:16px; }
  p { font-size:16px; line-height:1.7; max-width:480px; margin-bottom:30px; color:var(--ink); }
  a.btn { display:inline-block; padding:14px 28px; border:1px solid var(--gold); color:var(--gold);
          text-decoration:none; font-size:14px; letter-spacing:.1em; transition:.2s; }
  a.btn:hover { background:var(--gold); color:var(--deep); }
  p.link { margin:34px 0 0; font-size:14px; color:var(--muted); }
  p.link a { color:var(--gold); text-decoration:underline; text-underline-offset:3px; }
  footer { text-align:center; padding:24px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<img class="banner" src="forside.jpg" alt="Maleri af Elisabeth Gram med logoet EG Galleri">
<main>
  <h1>Elisabeth Gram</h1>
  <div class="sub">Malerier · Stentøj</div>
  <hr>
  <div class="status">Ny hjemmeside under konstruktion</div>
  <p>Indtil den nye side er klar, kan du se værkerne på den nuværende hjemmeside.</p>
  <a class="btn" href="http://www.elisabeth.minisite.dk">Se værkerne her</a>
  <p class="link">Elisabeths nuværende hjemmeside:<br>
     <a href="http://www.elisabeth.minisite.dk">www.elisabeth.minisite.dk</a></p>
</main>
<footer>GalleriEG · www.gallerieg.dk</footer>
</body>
</html>
